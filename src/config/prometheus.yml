global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'nestjs-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3003']

  - job_name: 'otel-collector'
    static_configs:
      # Use the compose service name (otel-collector), not the container name:
      # the container is otel-collector-dev/-test/-prod depending on the stack,
      # so a container-name target is only resolvable in development.
      - targets: ['otel-collector:8889']
